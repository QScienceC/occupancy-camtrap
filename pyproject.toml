[project]
name = "occreview"
version = "0.1.0"
description = "Reproduces the experiments of 'Reviewing the right camera-trap images: a procedure for occupancy estimates from a small part of a survey'"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occreview"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
occreview = "occreview.cli:main"
